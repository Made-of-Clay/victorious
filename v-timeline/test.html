<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test v-timeline</title>
    <link rel="stylesheet" href="../pico.violet.min.css">
    <link rel="stylesheet" href="v-timeline.css">
    <script type="module" src="v-timeline.js"></script>
    <style>
        body {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        win-icon::after {
            content: " 🏆";
        }
    </style>
</head>
<body>
    <h1>v-timeline Playground</h1>

    <v-timeline id="main-timeline">
        <template>
            <article>
                <h2>
                    <span></span> — <b></b>
                </h2>
                <time></time>
                <ul class="players">
                    <!-- populated dynamically -->
                </ul>
                <div class="notes"></div>
                <div class="actions" style="margin-top: 0.5rem;">
                    <button type="button">Edit</button>
                    <button type="button">Delete</button>
                </div>
            </article>
        </template>
    </v-timeline>

    <script type="module">
        async function loadTimelineData() {
            const response = await fetch('../data.json');
            if (!response.ok) {
                throw new Error(`Failed to load data.json: ${response.status} ${response.statusText}`);
            }
            return response.json();
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const timeline = document.getElementById('main-timeline');
            const data = await loadTimelineData();

            if (typeof timeline?.load === 'function') {
                timeline.load(data)
            } else {
                customElements.whenDefined('v-timeline').then(() => timeline.load(data));
            }
        });
    </script>
</body>
</html>
